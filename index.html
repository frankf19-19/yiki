.sg img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:3px}
.sg figcaption{font-size:13px;line-height:1.4;margin-top:6px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sg .has-audio{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--sun);border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.sg .has-audio .ico{width:15px;height:15px}
.story-form{display:flex;flex-direction:column;gap:8px}
.sf-row{display:flex;gap:8px}
.sf-row input{min-width:0;font-size:16px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:var(--wr-s);background:var(--card);font-family:inherit}
.sf-row input#styear{width:100px;flex:none}.sf-row input#sttext{flex:1}
.sf-row .small-btn{display:inline-flex;align-items:center;gap:6px;flex:1;justify-content:center}
.sf-row .small-btn .ico{width:16px;height:16px}

/* 今天的小看板 */
.orient{display:flex;align-items:stretch;gap:14px;width:100%;margin:4px 0 18px;padding:12px;background:var(--card);border:var(--edge);border-radius:var(--wr);box-shadow:var(--lift);text-align:left;position:relative}
.orient:active{transform:translateY(2px);box-shadow:none}
.cal{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.cal .cm{display:block;width:100%;text-align:center;background:var(--red);color:#fff;font-size:calc(13px * var(--fs));padding:3px 0}
.cal .cd{font-size:calc(46px * var(--fs));line-height:1.05;color:var(--ink);padding-top:4px}
.cal .cw{font-size:calc(16px * var(--fs));color:var(--red);padding-bottom:6px}
.ob{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:2px}
.ob .now{display:flex;align-items:center;gap:6px;font-size:calc(20px * var(--fs));color:var(--ink)}
.ob .now .ico{width:22px;height:22px;color:#E0943E}
.ob .plans{display:flex;flex-direction:column;gap:4px}
.ob .pl1{font-size:calc(16px * var(--fs));line-height:1.35;color:var(--ink);background:var(--sun-soft);border-radius:8px;padding:4px 8px}
.ob .pl1 b{margin-right:6px}
.ob .noplan{font-size:calc(15px * var(--fs));color:var(--ink-2);line-height:1.4}
.orient .spk{position:absolute;right:10px;top:10px;color:var(--ink-3)}
.orient .spk .ico{width:18px;height:18px}
.plan-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.plan-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card-2);border-radius:var(--wr-s)}
.plan-row .pw{flex:none;font-size:12px;background:var(--sun-soft);border:1px solid var(--ink);border-radius:999px;padding:2px 8px}
.plan-row .pt{flex:1;font-size:15px;min-width:0}
.plan-form{display:flex;flex-direction:column;gap:8px}
.plan-form input[type=text],.plan-form select,.plan-form input[type=time]{font-size:16px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:var(--wr-s);background:var(--card);font-family:inherit;min-width:0}
.plan-form select{flex:1}.plan-form input[type=time]{width:120px;flex:none}
/* 遇到狀況怎麼辦 */
.situ-list{display:flex;flex-direction:column;gap:8px}
.situ{border:1.5px solid var(--line);border-radius:var(--wr-s);background:var(--card)}
.situ[open]{border-color:var(--ink)}
.situ summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;font-size:16px}
.situ summary::-webkit-details-marker{display:none}
.situ summary .chev{width:18px;height:18px;transition:transform .2s}
.situ[open] summary .chev{transform:rotate(90deg)}
.situ .sb{padding:0 14px 12px}
.situ h4{margin:10px 0 4px;font-size:13px;color:var(--ink-2);font-weight:400}
.situ ul{margin:0;padding-left:20px;font-size:15px;line-height:1.6}
.situ ul.try li::marker{color:var(--ok)}
.situ ul.avoid li::marker{color:var(--red)}
.situ-tip{margin:10px 0 0;font-size:13px;color:var(--ink-2);background:var(--sun-soft);border-radius:8px;padding:8px 10px}

/* 坐著動一動 */
.move-entry{display:flex;align-items:center;gap:14px;width:100%;margin-top:22px;padding:10px 16px;background:#EAF3E3;border:var(--edge);border-radius:var(--wr);box-shadow:var(--lift);text-align:left}
.move-entry:active{transform:translateY(2px);box-shadow:none}
.move-entry .chev{width:22px;height:22px}
.mfig{width:100%;height:auto;overflow:visible}
.mfig path,.mfig circle{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.mfig .chair path{stroke:#9C7B5B}
.mfig .chair .seat{fill:#E8C9A0}
.mfig .shirt{fill:#9CC3A8}
.mfig .face{fill:#F6DCC2}
.mfig .hair{stroke-width:5;stroke:#B9B2AA}
.mfig .dot{fill:var(--ink);stroke:none}
.mfig .hand{fill:#F6DCC2}
.mfig .ground path{stroke:#CDBFAE;stroke-width:2.4}
.mfig.mini{width:62px;flex:0 0 62px}
.move-stage{width:min(64vw,260px);margin:4px auto 0}
.move-stage.paused *{animation-play-state:paused!important}
.mfig .arm,.mfig .leg,.mfig .foot,.mfig .torso,.mfig .head,.mfig .hand{transform-box:fill-box}
.mfig .arm{transform-origin:50% 0}
.run .m-breathe .aL{animation:mvBreL 4s ease-in-out infinite}.run .m-breathe .aR{animation:mvBreR 4s ease-in-out infinite}
.run .m-breathe .torso{transform-origin:50% 100%;animation:mvSwell 4s ease-in-out infinite}
@keyframes mvBreL{0%,100%{transform:rotate(0)}45%,55%{transform:rotate(80deg)}}
@keyframes mvBreR{0%,100%{transform:rotate(0)}45%,55%{transform:rotate(-80deg)}}
@keyframes mvSwell{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.run .m-shoulder .arm,.run .m-shoulder .torso{animation:mvShrug 4s ease-in-out infinite}
.run .m-shoulder .head{animation:mvShrugH 4s ease-in-out infinite}
@keyframes mvShrug{0%,100%{transform:translateY(0)}40%,55%{transform:translateY(-8px)}}
@keyframes mvShrugH{0%,100%{transform:translateY(0)}40%,55%{transform:translateY(-3px)}}
.run .m-reach .aL{animation:mvUpL 4s ease-in-out infinite}.run .m-reach .aR{animation:mvUpR 4s ease-in-out infinite}
@keyframes mvUpL{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(168deg)}}
@keyframes mvUpR{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-168deg)}}
.m-hands .aL{transform:rotate(42deg)}.m-hands .aR{transform:rotate(-42deg)}
html:not(.gentle) .mfig .body,html:not(.gentle) .mfig .chair{filter:url(#wobs)}
.mfig .hand{transform-origin:50% 50%}
.run .m-hands .hand{animation:mvFist 4s ease-in-out infinite}
@keyframes mvFist{0%,100%{transform:scale(1.35)}45%,55%{transform:scale(.7)}}
.run .m-knee .lL{animation:mvKnee 4s ease-in-out infinite}.run .m-knee .lR{animation:mvKnee 4s ease-in-out 2s infinite}
@keyframes mvKnee{0%,40%,100%{transform:translateY(0)}15%,25%{transform:translateY(-16px)}}
.mfig .foot{transform-origin:0% 100%}
.run .m-toes .foot{animation:mvToe 4s ease-in-out infinite}
.run .m-toes .lL .foot{transform-origin:100% 100%}
@keyframes mvToe{0%,100%{transform:translateY(0)}40%,60%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.run .mfig *{animation-duration:8s!important}}
.move-safe{margin-top:14px;padding:14px 16px}
.move-safe b{display:block;font-size:calc(19px*var(--fs,1));margin-bottom:6px}
.move-safe ul{margin:0;padding-left:1.2em;font-size:calc(18px*var(--fs,1));line-height:1.6}
.move-name{text-align:center;font-size:calc(30px*var(--fs,1));margin:10px 0 4px}
.move-cue{text-align:center;font-size:calc(20px*var(--fs,1));line-height:1.55;margin:0 auto;max-width:28em}
.reps{display:flex;justify-content:center;gap:10px;margin-top:18px}
.rp{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink);background:transparent;transition:background .25s}
.rp.on{background:#F5D04E}
.move-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.move-fin{text-align:center;font-size:calc(20px*var(--fs,1));line-height:1.6}

/* 聽歌猜歌名 */
.song-stage{width:min(56vw,230px);margin:4px auto 0}
.mbox{width:100%;height:auto;overflow:visible}
.mbox .disc{transform-box:fill-box;transform-origin:50% 50%}
.mbox .notes{opacity:0;transition:opacity .3s}
.playing .mbox .disc{animation:spin 3.2s linear infinite}
.playing .mbox .notes{opacity:1;animation:bob 1.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.playing .mbox .disc,.playing .mbox .notes{animation:none}}
.song-again{display:flex;align-items:center;gap:6px;margin:10px auto 0}
.song-opts{margin-top:16px;display:grid;grid-template-columns:1fr!important;gap:10px}
.song-opts .opt{min-height:64px;font-size:calc(21px*var(--fs,1))}
.song-name{text-align:center;font-size:calc(30px*var(--fs,1));margin-top:10px}
.song-mem{text-align:center;font-size:calc(20px*var(--fs,1));line-height:1.6;margin:8px auto 18px;max-width:24em}
.song-next{width:100%}

/* 家人語音便條 */
.listen-note{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:calc(58px*var(--fs,1));margin-top:12px;border-radius:999px;background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:calc(20px*var(--fs,1))}
.listen-note:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.listen-note .ico{width:24px;height:24px}
.note-voice{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 2px}
.note-voice .small-btn{display:inline-flex;align-items:center;gap:5px}
.note-voice .small-btn .ico{width:16px;height:16px}
.nv-ok{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:700}
.nv-ok .ico{width:16px;height:16px}
.nv-hint{color:var(--ink-2);font-size:13px}

/* 走失緊急聯絡卡 */
.sos-form{display:flex;flex-direction:column;gap:8px}
.sos-row{display:grid;grid-template-columns:2fr 3fr;gap:8px}
.sos-in{font-size:16px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;min-width:0;width:100%;box-sizing:border-box}
.sos-form .save-btn{align-self:flex-end}
.sos-prev{display:grid;grid-template-columns:3fr 1.2fr;gap:10px;align-items:start;margin-top:14px}
.sos-prev img{width:100%;border-radius:8px;box-shadow:0 4px 12px -6px rgba(62,49,40,.4);background:#eee}
.sos-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sos-acts .small-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;line-height:1.2}
.sos-tips{margin-top:14px;background:#FFF8E6;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6}
.sos-tips ul{margin:4px 0 0;padding-left:1.2em}
.help-entry{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:12px;border-radius:999px;border:2px dashed var(--red);color:var(--red);background:transparent;font-size:calc(18px*var(--fs,1))}
.help-entry .ico{width:20px;height:20px}
.help-calm{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.help-calm svg{width:80px;flex:0 0 80px}
.help-calm p{font-size:calc(21px*var(--fs,1));line-height:1.5;margin:0}
.help-card{background:#fff;border:var(--edge);border-radius:16px;overflow:hidden;box-shadow:var(--lift)}
.hc-top{background:#B9412C;color:#fff;padding:16px 18px;font-size:calc(22px*var(--fs,1));line-height:1.45}
.hc-name{padding:16px 18px 4px;font-size:calc(32px*var(--fs,1));font-weight:700}
.hc-note{padding:0 18px 16px;font-size:calc(18px*var(--fs,1));color:var(--ink-2)}
.help-calls{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.call-btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:var(--ink)}
.call-btn .ico{width:26px;height:26px}
.print-only{display:none}
@media print{body.printing > *:not(.print-only){display:none!important}body.printing .print-only{display:block!important}.print-only img{width:85.6mm;height:54mm;display:block;margin:0 0 8mm}}

/* 今天的好習慣 */
.habits{margin-top:22px;background:#F2F7EC;border:var(--edge);border-radius:var(--wr);padding:14px 14px 12px;box-shadow:var(--lift)}
.hb-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.hb-head b{font-size:calc(20px*var(--fs,1))}
.hb-head span{color:var(--ink-2);font-size:calc(15px*var(--fs,1))}
.hb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hb{position:relative;display:flex;align-items:center;gap:8px;min-height:calc(58px*var(--fs,1));padding:8px 12px;border-radius:14px;border:2px solid var(--ink);background:#fff;font-size:calc(18px*var(--fs,1));text-align:left;color:var(--ink)}
.hb .ico{width:24px;height:24px;flex:none}
.hb.on{background:#CFE6BE;border-color:#3F7A4A}
.hb.auto{border-style:dashed}
.hb.auto:disabled{opacity:1}
.hb-ok{position:absolute;top:-8px;right:-6px;width:26px;height:26px;border-radius:50%;background:#3F7A4A;display:flex;align-items:center;justify-content:center}
.hb-ok .ico{width:16px;height:16px;stroke:#fff}
.hb-note{margin:8px 2px 0;font-size:calc(14px*var(--fs,1));color:var(--ink-2)}
.hb-switch{display:flex;align-items:center;gap:10px;font-size:16px;margin:4px 0 10px}
.hb-switch input,.hb-opt input{width:22px;height:22px;accent-color:#3F7A4A}
.hb-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hb-opt{display:flex;align-items:center;gap:6px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
.hb-opt .ico{width:18px;height:18px}
.hb-week{display:flex;flex-direction:column;gap:6px}
.hw-row{display:grid;grid-template-columns:7.5em repeat(7,1fr);align-items:center;gap:4px}
.hw-row span{display:flex;align-items:center;gap:4px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hw-row span .ico{width:16px;height:16px;flex:none}
.hw-row i{font-style:normal;height:26px;border-radius:8px;background:#F1ECE4;display:flex;align-items:center;justify-content:center}
.hw-row i.on{background:#CFE6BE}
.hw-row i .ico{width:15px;height:15px;stroke:#3F7A4A}
.hw-h i{background:none;height:auto;font-size:12px;color:var(--ink-2)}

/* 開始使用清單 */
.setup{background:#FFF8E1;border:var(--edge);box-shadow:var(--lift)}
.su-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.su-head b{display:block;font-size:19px}
.su-head small{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
.su-n{font-weight:700;font-size:17px;white-space:nowrap}
.su-bar{height:10px;border-radius:999px;background:#EFE4CC;margin:10px 0 6px;overflow:hidden;border:1.5px solid var(--ink)}
.su-bar i{display:block;height:100%;background:#F5D04E;transition:width .4s}
.su-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.su-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 6px;background:none;border:none;border-bottom:1.5px dashed #E3D6BD;text-align:left;color:var(--ink)}
.su-list li:last-child .su-row{border-bottom:none}
.su-ck{width:28px;height:28px;flex:none;border-radius:50%;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;background:#fff}
.su-row.done .su-ck{background:#3F7A4A;border-color:#3F7A4A}
.su-ck .ico{width:16px;height:16px;stroke:#fff}
.su-t{flex:1;display:flex;flex-direction:column}
.su-t span{font-size:16px;font-weight:700}
.su-t small{font-size:13px;color:var(--ink-2)}
.su-row.done .su-t span{color:var(--ink-2);text-decoration:line-through;font-weight:400}
.su-row.done .su-t small{display:none}
.su-row .chev{width:20px;height:20px;flex:none}
.su-hide{display:block;margin:8px 0 0 auto;background:none;border:none;color:var(--ink-2);font-size:14px;text-decoration:underline}
.sec.flash{animation:flashSec 2.2s ease}
@keyframes flashSec{0%,60%{box-shadow:0 0 0 4px #F5D04E}100%{box-shadow:0 0 0 0 transparent}}

/* 首頁整理：並排方塊＋底部固定按鈕 */
.more-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.more-tiles.one{grid-template-columns:1fr}
.mtile{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:14px 10px 12px;border:var(--edge);border-radius:var(--wr);box-shadow:var(--lift);text-align:center;color:var(--ink)}
.mtile:active{transform:translateY(2px);box-shadow:none}
.mtile.move-t{background:#EAF3E3}.mtile.story-t{background:#FFF1E6}
.mtile .mfig.mini{width:70px;flex:none;height:76px}
.mtile .polaroid.sm{width:66px;transform:rotate(-3deg);padding:5px 5px 14px}
.mtile .polaroid.sm img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.mt-t{font-size:calc(19px*var(--fs,1));font-weight:700;line-height:1.3}
.mt-s{font-size:calc(14px*var(--fs,1));color:var(--ink-2);line-height:1.35}
.more-tiles.one .mtile{flex-direction:row;text-align:left;gap:14px}
.more-tiles.one .mt-t{flex:none}
.home-actions{position:sticky;bottom:0;z-index:5;margin-left:-4px;margin-right:-4px;padding:18px 4px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to bottom, rgba(251,247,238,0), var(--paper) 28%)}
.nav-r{display:flex;gap:8px;align-items:center}
.help-pill{border-color:var(--red)!important;color:var(--red)!important;background:#FFF0EC!important}
.help-pill .ico{stroke:var(--red)}

/* 版面：小螢幕、大字體不超出畫面 */
.grid > *{min-width:0}
.opt,.hb span,.hb-opt span,.mt-t,.mt-s,.su-t span{overflow-wrap:anywhere}
.tile.word{overflow-wrap:break-word;word-break:normal}
.bubble,.bubble p{overflow-wrap:break-word}
html[lang^=en] .tile.word{font-size:calc(20px * var(--fs));hyphens:auto}
.scene .bubble{min-width:0}
.log-strip{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.log-day{padding:7px 2px;min-width:0}
.hb-grid,.hb-pick{grid-template-columns:repeat(2,minmax(0,1fr))}
.hw-row{grid-template-columns:minmax(4.5em,7.5em) repeat(7,minmax(0,1fr))}
.summary{box-sizing:border-box;width:100%}
.summary table{table-layout:fixed;word-break:break-word}
@media (max-width:380px){
  .grid:has(> .tile.word){grid-template-columns:repeat(2,minmax(0,1fr))!important}
  html[lang^=en] .tile.word{font-size:calc(18px * var(--fs))}
  .week{flex-wrap:wrap;gap:6px}
  .week .wl{width:100%}
  .week .d i{width:28px;height:28px}
  .log-day .dots i{width:7px;height:7px}
  .log-day .dots{gap:2px}
  .summary{padding:20px 14px 30px}
  .summary .kp{grid-template-columns:repeat(2,1fr)}
  .sos-row{grid-template-columns:1fr}
}
@media (max-width:360px){
  .bubble .hi{font-size:calc(24px * var(--fs))}
  .bubble p{font-size:calc(16px * var(--fs))}
  .scene .home-m,.scene > svg{width:64px;flex:0 0 64px}
  .hb-grid{grid-template-columns:1fr}
  .more-tiles{grid-template-columns:1fr}
  .more-tiles .mtile{flex-direction:row;text-align:left;gap:12px}
}

/* 高對比：覆蓋 v2.0 繪本風的新色彩變數 */
html.hc{--paper:#FFFFFF;--card:#FFFFFF;--card-2:#F0F0F0;--bg-2:#F0F0F0;--ink:#000000;--ink-2:#111111;--ink-3:#333333;--line:#000000;--hair:rgba(0,0,0,.5);--edge:2.5px solid #000}
html.hc body{background:#FFFFFF!important}
html.hc .note-card,html.hc .habits,html.hc .mtile,html.hc .setup,html.hc .orient,html.hc .bubble,html.hc .pcard,html.hc .help-card,html.hc .sos-tips,html.hc .situ{background:#FFFFFF!important;border-color:#000!important}
html.hc .hint,html.hc small,html.hc .row-s,html.hc .mt-s,html.hc .hb-note{color:#111!important}

/* 出題避開最近玩過的：每款遊戲記住最近出過的題目，優先出還沒看過的 */
function freshPick(key, pool, n, idf = x => x.n, accept = null){
  S.recent = S.recent || {}; const rec = Array.isArray(S.recent[key]) ? S.recent[key] : [];
  const seen = new Set(rec);
  const fresh = shuffle(pool.filter(x => !seen.has(idf(x))));
  const old = pool.filter(x => seen.has(idf(x))).sort((a,b) => rec.indexOf(idf(a)) - rec.indexOf(idf(b)));
  let out;
  if(accept){ out = []; for(const x of fresh.concat(old)){ if(out.length >= n) break; if(accept(out, x)) out.push(x); }
    if(out.length < n) out = out.concat(fresh.concat(old).filter(x => !out.includes(x)).slice(0, n - out.length)); }
  else out = fresh.concat(old).slice(0, n);
  const cap = Math.max(6, Math.floor(pool.length * 0.75));
  const ids = new Set(out.map(idf));
  S.recent[key] = rec.filter(id => !ids.has(id)).concat([...ids]).slice(-cap);
  return out;
}

function clockSVG(h, m){
  const cx=100, cy=100;
  const ticks = Array.from({length:60},(_,i)=>{ const a=i*6*Math.PI/180, big=i%5===0, r1=big?72:77, r2=82;
    return `<line x1="${cx+r1*Math.sin(a)}" y1="${cy-r1*Math.cos(a)}" x2="${cx+r2*Math.sin(a)}" y2="${cy-r2*Math.cos(a)}" stroke="${big?'#2B2621':'#C9BFAE'}" stroke-width="${big?3:1.5}" stroke-linecap="round"/>`; }).join('');
  const nums = Array.from({length:12},(_,i)=>{ const n=i+1, a=n*30*Math.PI/180, r=59; return `<text x="${cx+r*Math.sin(a)}" y="${cy-r*Math.cos(a)+7}" text-anchor="middle" font-size="21" fill="#2B2621" font-family="inherit">${n}</text>`; }).join('');
  const ha=((h%12)+m/60)*30*Math.PI/180, ma=m*6*Math.PI/180;
  return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="${esc(U.ariaClock)}">
    <g filter="url(#wob)"><circle cx="${cx}" cy="${cy}" r="94" fill="#F5D04E" stroke="#2B2621" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="86" fill="#FFFDF8" stroke="#2B2621" stroke-width="2.5"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${cx+40*Math.sin(ha)}" y2="${cy-40*Math.cos(ha)}" stroke="#2B2621" stroke-width="8" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${cx+62*Math.sin(ma)}" y2="${cy-62*Math.cos(ma)}" stroke="#E0503D" stroke-width="5" stroke-linecap="round"/></g>
    <g style="paint-order:stroke;stroke:#FFFDF8;stroke-width:5px;stroke-linejoin:round">${nums}</g>
    <circle cx="${cx}" cy="${cy}" r="7" fill="#F5D04E" stroke="#2B2621" stroke-width="2.5"/></svg>`;
}

let melodyNodes = [];
function stopMelody(){ melodyNodes.forEach(o=>{ try{ o.stop(); }catch(_){} }); melodyNodes = []; }
function playMelody(id, bpm=96, vol=.9){
  stopMelody(); const notes = MELODIES[id]; if(!notes) return 0;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(_){ return 0; }
  const beat = 60/bpm; let t = AC.currentTime + .08;
  const master = AC.createGain(); master.gain.value = vol; master.connect(AC.destination);
  notes.forEach(([m,b]) => { const f = 440*Math.pow(2,(m-69)/12), dur = Math.max(.35, b*beat*1.25);
    [[1,'sine',.22],[2,'sine',.05],[3,'triangle',.025]].forEach(([mul,type,v]) => {
      const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f*mul;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(master); o.start(t); o.stop(t+dur+.05); melodyNodes.push(o); });
    t += b*beat; });
  return (t - AC.currentTime)*1000;
}

GAMES.digits = async function(ctx){

    await wait(showMs); if(ctx.dead) return;

};
GAMES.clock = async function(ctx){
  const rounds = 5; const stepByLevel=[60,30,15,5,5]; const step=stepByLevel[ctx.level-1];
  const fmt = L.clock.fmt;
  for(let r=1; r<=rounds; r++){
    if(ctx.dead) return; ctx.round(); ctx.setRound(r, rounds);
    const h = rnd(1,12), m = step===60 ? 0 : rnd(0, 60/step-1)*step;
    const key = `${h}:${m}`; const wrongs = new Set();
    while(wrongs.size<3){ let wh=h, wm=m;
      const t = ctx.level>=4 ? pick(['h','m','hm']) : pick(['h','h','m']);
      if(t.includes('h')) wh = ((h-1+pick([1,2,3,6,11,10,9]))%12)+1;
      if(t.includes('m')) { wm = step===60 ? pick([30,15,45]) : (m + pick([step,-step,15,30,-15]) + 60) % 60; if(step===30) wm = wm===0?30:0; }
      if(step===60 && t==='h') wm = 0;
      const k=`${wh}:${wm}`; if(k!==key) wrongs.add(k); }
    const opts = shuffle([key, ...wrongs]).map(k=>{ const [a,b]=k.split(':').map(Number); return {k, t: fmt(a,b)}; });
    ctx.el.innerHTML = `<div class="clock-wrap">${clockSVG(h,m)}</div>
      <div class="options">${opts.map(o=>`<button class="opt" data-k="${o.k}">${esc(o.t)}</button>`).join('')}</div>`;
    await new Promise(res => { ctx.el.onclick = async e => { const b = e.target.closest('.opt'); if(!b) return;
      if(b.dataset.k === key){ ctx.hit(); ctx.el.onclick=null; b.classList.add('ok'); await ctx.feedback(true, fmt(h,m)); res(); }
      else { ctx.miss(); ctx.badTap(b); ctx.hintIf(ctx.el.querySelector(`.opt[data-k="${key}"]`)); } }; });
  }
  ctx.finish();
};

/* 10. 誰跟誰一對（詞語配對） */
/* 同一盤不要放容易混淆的兩組（例如「魚—水」和「青蛙—池塘」：魚配池塘也說得通，長輩會被誤判答錯）
   自動規則：兩組詞共用漢字／韓文字／英文字根就不同盤；再加上各語言的人工清單 L.wpClash */
const WP_STOP = new Set(['子','的','兒','ー','人','大','小']);
const wpTokens = w => { const t = new Set(); String(w).toLowerCase().split(/[\s-]+/).forEach(x => { if(/^[a-z]/.test(x)){ if(x.length >= 3) t.add(x.slice(0,4)); } });
  for(const ch of String(w)) if(/[\u4e00-\u9fff\u30a0-\u30ff\uac00-\ud7af]/.test(ch) && !WP_STOP.has(ch)) t.add(ch); return t; };
let wpClashSet = null;
function wpClash(p, q){
  if(!wpClashSet){ wpClashSet = new Set(); (L.wpClash||[]).forEach(([a,b]) => { wpClashSet.add(a+'|'+b); wpClashSet.add(b+'|'+a); }); }
  for(const a of p) for(const b of q){ if(wpClashSet.has(a+'|'+b)) return true; const ta = wpTokens(a); for(const x of wpTokens(b)) if(ta.has(x)) return true; }
  return false;
}
GAMES.wordpairs = async function(ctx){
  const rounds = 2, k = [3,4,4,5,6][ctx.level-1];
  for(let r=1; r<=rounds; r++){
    if(ctx.dead) return; ctx.round(); ctx.setRound(r, rounds);
    const pairs = freshPick('wordpairs', L.wordPairs, k, p => p[0], (got, p) => got.every(q => !wpClash(p, q)));
    const words = shuffle(pairs.flatMap((p,i)=>[{w:p[0],i},{w:p[1],i}]));
    const cols = words.length<=8?2:3;
    ctx.el.innerHTML = gridHTML(cols, words.map((x,j)=>`<button class="tile word" data-j="${j}" data-i="${x.i}">${esc(x.w)}</button>`).join('')) + `<div class="hint-line" id="wh">${U.pairsLeft(k)}</div>`;
    let first=null, left=k, lock=false;
    await new Promise(res => { ctx.el.onclick = async e => { const t = e.target.closest('.word'); if(!t || lock || t.classList.contains('gone')) return;
      if(!first){ first=t; t.classList.add('sel'); SFX.tap(); return; }
      if(first===t){ t.classList.remove('sel'); first=null; return; }
      lock=true;
      if(first.dataset.i===t.dataset.i){ ctx.hit(); SFX.good(); first.classList.add('ok'); t.classList.add('ok'); await wait(420); first.classList.add('gone'); t.classList.add('gone'); left--; const h=$('#wh'); if(h) h.innerHTML=U.pairsLeft(left);
        first=null; lock=false; if(left===0){ ctx.el.onclick=null; await ctx.feedback(true); res(); } }
      else { ctx.miss(); SFX.bad(); first.classList.add('bad'); t.classList.add('bad'); await wait(500); first.classList.remove('bad','sel'); t.classList.remove('bad'); first=null; lock=false; } }; });
  }
  ctx.finish();
};

function moveTick(){
  if(!mv || location.hash!=='#move' || mv.paused) return;
  mv.c++;
  const dots = document.querySelectorAll('.reps .rp'); if(dots[mv.c-1]) dots[mv.c-1].classList.add('on');
  speak(String(mv.c)); tone([[660,0,.08]]);
  if(mv.c >= mv.reps){ clearInterval(mv.t); mv.t = setTimeout(()=>moveNext(true), 1600); }
}
function moveStartStep(){
  if(!mv) return; clearInterval(mv.t); clearTimeout(mv.t);
  mv.c = 0; mv.paused = false; renderMove();
  if(mv.i >= MOVE_KEYS.length) return;
  speak(L.moves[MOVE_KEYS[mv.i]].say);
  mv.t = setTimeout(()=>{ if(!mv) return; mv.t = setInterval(moveTick, 4000); }, 3000);
}
function moveNext(done){
  if(!mv) return; if(done) mv.done++;
  mv.i++;
  if(mv.i >= MOVE_KEYS.length){
    if(mv.done >= 3){ S.moveLog = S.moveLog||{}; S.moveLog[todayKey()] = (S.moveLog[todayKey()]||0)+1; save(); }
    clearInterval(mv.t); clearTimeout(mv.t); renderMove(); return;
  }
  moveStartStep();
}
function moveStop(){ if(mv){ clearInterval(mv.t); clearTimeout(mv.t); } mv = null; hush(); }

function rangeDays(from, n){ const out=[]; const d=new Date(); for(let i=from+n-1;i>=from;i--){ const x=new Date(d); x.setDate(d.getDate()-i); out.push(todayKey(x)); } return out; }
function insightHTML(){
  const A = rangeDays(0,7), B = rangeDays(7,7);
  const sa = S.sessions.filter(x=>A.includes(x.d)), sb = S.sessions.filter(x=>B.includes(x.d));
  const avg = xs => xs.length ? Math.round(xs.reduce((a,b)=>a+b.score,0)/xs.length) : null;
  const daysA = new Set(sa.map(x=>x.d)).size, daysB = new Set(sb.map(x=>x.d)).size;
  const aA = avg(sa);
  const doms = Object.keys(L.domains).map(d=>[d, avg(sa.filter(x=>x.dom===d)), sa.filter(x=>x.dom===d).length]).filter(x=>x[1]!==null);
  const best = doms.slice().sort((x,y)=>y[1]-x[1])[0];
  const allDoms = Object.keys(L.domains); const played = new Set(sa.map(x=>x.dom));
  const unplayed = allDoms.filter(d=>!played.has(d));
  const low = unplayed.length ? null : doms.slice().sort((x,y)=>x[1]-y[1])[0];
  const logsA = A.map(k=>S.logs[k]).filter(Boolean);
  const badSleep = logsA.filter(l=>l.sleep===2).length, evN = logsA.reduce((n,l)=>n+(l.events||[]).length,0);
  const items = [];
  items.push(['calendar', U.insDays(daysA, daysB)]);
  /* 跟前一週比：只比同一款遊戲、同一難度（升級後題目變難，分數自然會降，不能算退步）；兩週各至少 4 次才比 */
  const grp = xs => xs.reduce((m,x)=>{ (m[x.g+'|'+x.lvl] = m[x.g+'|'+x.lvl] || []).push(x.score); return m; }, {});

  Object.keys(gA).forEach(k => { if(!gB[k]) return; const wt = Math.min(gA[k].length, gB[k].length); dsum += (mean(gA[k]) - mean(gB[k])) * wt; dw += wt; nA += gA[k].length; nB += gB[k].length; });
  const diff = dw && nA >= 4 && nB >= 4 ? Math.round(dsum / dw) : null;
  if(aA!==null){ items.push([diff===null?'flat':diff>=3?'trendUp':diff<=-3?'trendDn':'flat', U.insAvg(aA, diff)]); }
  if(best) items.push(['star', U.insBest(L.domains[best[0]].name)]);
  /* 這週升級了哪些（看同一款遊戲的紀錄裡難度變高） */

    if(!inA.length) return; const lo = before ? before.lvl : inA[0].lvl, hi = Math.max(levelOf(g), ...inA.map(x => x.lvl)); if(hi > lo) ups.push([L.games[g].name, lo, hi]); });
  if(ups.length) items.push(['trendUp', U.insLvUp(ups)]);
  if(unplayed.length) items.push(['compass', U.insTry(unplayed.map(d=>L.domains[d].name))]);
  else if(low && best && low[0]!==best[0]) items.push(['sun', U.insLow(L.domains[low[0]].name)]);
  if(logsA.length) items.push(['note', U.insLog(logsA.length, badSleep, evN)]);
  const sv = A.reduce((n,k)=>n+((S.storyLog||{})[k]||0),0); if(sv) items.push(['heart', U.insStory(sv)]);
  const mvn = A.reduce((n,k)=>n+((S.moveLog||{})[k]||0),0); if(mvn) items.push(['flame', U.insMove(mvn)]);
  if(habOn()){ const hs = habKeys().filter(h=>h!=='brain').map(h=>[h, A.filter(k=>habDone(h,k)).length]).filter(x=>x[1]>0); if(hs.length) items.push(['check', U.insHabit(hs.map(([h,n])=>[L.habits[h], n]))]); }
  const watch = diff !== null && diff <= -10 && sa.length >= 6 && sb.length >= 6;
  return `<h2>${esc(U.insTitle)}<small>${esc(U.insSub)}</small></h2>
    <ul class="ins">${items.map(([i,t])=>`<li><span class="i">${ico(i)}</span><span>${esc(t)}</span></li>`).join('')}</ul>
    ${watch?`<div class="ins-note">${esc(U.insWatch)}</div>`:''}`;

function lastNDays(n){ const out=[]; const d=new Date(); for(let i=n-1;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); out.push(todayKey(x)); } return out; }
function dayAvg(key){ const xs=sessionsOn(key); return xs.length?Math.round(xs.reduce((a,b)=>a+b.score,0)/xs.length):null; }

function weekChart(days){
  const W=640,H=190,pl=44,pr=8,pt=22,pb=30, iw=W-pl-pr, ih=H-pt-pb, bw=Math.min(46, iw/days.length*0.56);
  const y=v=>pt+ih-(v/100)*ih;
  const bars = days.map((k,i)=>{ const v=dayAvg(k), cx=pl+iw*(i+.5)/days.length, wd=new Date(k+'T00:00:00').getDay();
    const lbl = `<text x="${cx}" y="${H-8}" text-anchor="middle" class="axis" ${k===todayKey()?'fill="#2B2621" text-decoration="underline"':''}>${L.ui.weekdays[wd]}</text>`;
    if(v===null) return `<rect x="${cx-bw/2}" y="${y(3)}" width="${bw}" height="${ih*0.03}" rx="2" fill="#E4DCCB"/>${lbl}`;
    const n = sessionsOn(k).length, h = y(0)-y(v);
    return `<g class="hv" data-tip="${esc(U.tipDay(k,v,n))}"><path d="M${cx-bw/2},${y(0)} v${-h+6} a6,6 0 0 1 6,-6 h${bw-12} a6,6 0 0 1 6,6 v${h-6} z" fill="#F5D04E" stroke="#2B2621" stroke-width="2" filter="url(#wobs)"/><text x="${cx}" y="${y(v)-7}" text-anchor="middle" fill="#2B2621">${v}</text></g>${lbl}`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(U.ariaWeek)}"><defs><linearGradient id="gbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E9A72"/><stop offset="1" stop-color="#1F4D3A"/></linearGradient></defs>
    <g class="grid">${[0,50,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+6}" text-anchor="end" class="axis">${v}</text>`).join('')}</g>${bars}</svg>`;
}
function trendChart(days){
  const W=640,H=210,pl=44,pr=14,pt=16,pb=30, iw=W-pl-pr, ih=H-pt-pb;
  const x=i=>pl+iw*i/(days.length-1), y=v=>pt+ih-(v/100)*ih;
  const pts = days.map((k,i)=>({k,i,v:dayAvg(k)})).filter(p=>p.v!==null);
  const path = pts.map((p,j)=>`${j?'L':'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = pts.length>1 ? `${path} L${x(pts[pts.length-1].i)},${y(0)} L${x(pts[0].i)},${y(0)} Z` : '';
  const ticks = [0,7,14,21,27].map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="axis">${days[i].slice(5).replace('-','/')}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(U.ariaTrend)}"><defs><linearGradient id="garea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5D04E" stop-opacity=".55"/><stop offset="1" stop-color="#3E9A72" stop-opacity="0"/></linearGradient></defs>
    <g class="grid">${[0,50,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+6}" text-anchor="end" class="axis">${v}</text>`).join('')}</g>${ticks}
    ${area?`<path d="${area}" fill="url(#garea)"/>`:''}
    <path d="${path}" fill="none" stroke="#2B2621" stroke-width="2.5" filter="url(#wobs)" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<g class="hv" data-tip="${esc(U.tipDay(p.k,p.v,sessionsOn(p.k).length))}"><circle cx="${x(p.i)}" cy="${y(p.v)}" r="4.5" fill="#FFFDF8" stroke="#2B2621" stroke-width="2"/><circle cx="${x(p.i)}" cy="${y(p.v)}" r="14" fill="transparent"/></g>`).join('')}</svg>`;
}
function radarChart(avg){
  const keys=Object.keys(L.domains), n=keys.length, cx=105, cy=105, R=72;
  const pt=(i,r)=>{ const a=-Math.PI/2 + i*2*Math.PI/n; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  const ring = r => keys.map((_,i)=>pt(i,r).join(',')).join(' ');
  const has = keys.some(k=>avg[k]!==null);
  const poly = keys.map((k,i)=>pt(i, R*((avg[k]??0)/100)).join(',')).join(' ');
  return `<svg class="chart" viewBox="0 0 210 210" role="img" aria-label="${esc(U.ariaRadar)}" style="max-width:230px;margin:0 auto">
    ${[.33,.66,1].map(f=>`<polygon points="${ring(R*f)}" fill="${f===1?'#FFFDF8':'none'}" stroke="#D9CFBC" stroke-width="1"/>`).join('')}
    ${keys.map((_,i)=>{const [x,y]=pt(i,R); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#D9CFBC"/>`;}).join('')}
    ${has?`<polygon points="${poly}" fill="rgba(245,208,78,.5)" stroke="#2B2621" stroke-width="2.5" stroke-linejoin="round"/>
    ${keys.map((k,i)=>{ if(avg[k]===null) return ''; const [x,y]=pt(i,R*avg[k]/100); return `<circle cx="${x}" cy="${y}" r="4" fill="#2B2621" stroke="#FFFDF8" stroke-width="2"/>`; }).join('')}`:''}
    ${keys.map((k,i)=>{const [x,y]=pt(i,R+20); return `<circle cx="${x}" cy="${y}" r="6" fill="${DOM_COLOR[k]}" stroke="#fff" stroke-width="2"/>`;}).join('')}
  </svg>`;
}

  const ha = e.target.closest('#ha button'); if(ha){ S.hintAfter = +ha.dataset.v; save(); renderFamily(); }
  const vc = e.target.closest('#vc button'); if(vc){ S.voice = vc.dataset.v==='1'; save(); renderFamily(); }
  const sd = e.target.closest('#sd button'); if(sd){ S.sound = sd.dataset.v==='1'; save(); renderFamily(); if(S.sound) SFX.good(); }
});

let pendingPhotoName = '';
document.addEventListener('change', async e => {
  if(e.target.dataset && e.target.dataset.home){ setHomeItem(e.target.dataset.home, e.target.checked); save(); const hs=$('#habon'); if(hs) hs.checked = habOn(); toast(U.saved); return; }
  if(e.target.dataset && e.target.dataset.hab){ S.hab = S.hab || {};
    if(e.target.dataset.hab==='on'){ S.hab.on = e.target.checked; const hc=document.querySelector('[data-home=habits]'); if(hc) hc.checked = S.hab.on; }
    else { const ks = [...document.querySelectorAll('[data-hab=key]')].filter(x=>x.checked).map(x=>x.dataset.k); if(!ks.length){ e.target.checked = true; toast(U.habNeedOne); return; } S.hab.keys = HABIT_ALL.filter(k=>ks.includes(k)); if(typeof S.hab.on!=='boolean') S.hab.on = habOn(); }
    save(); toast(U.saved); return; }
  if(e.target.id==='stfile' && e.target.files[0]){ const f=e.target.files[0]; e.target.value='';
    try{ const img = await shrinkImage(f, 520); S.story = S.story||[]; const pg = { id: Date.now().toString(36), img, text: pendingStory?.text||'', year: pendingStory?.year||'', audio: pendingStory?.audio||null };
      S.story.push(pg); if(!save(true)){ S.story.pop(); toast(U.photoSaveFail); return; } pendingStory = null; $('#storysec').innerHTML = storySecHTML(); toast(U.saved); }catch(_){ toast(U.importFail); }
    return; }
  if(e.target.id==='phfile' && e.target.files[0]){ const f=e.target.files[0]; e.target.value='';
    try{ const img = await shrinkImage(f); S.photos = S.photos||[]; S.photos.push({ id: Date.now().toString(36), name: pendingPhotoName, img });
      if(!save(true)){ S.photos.pop(); toast(U.photoSaveFail); return; }
      $('#photosec').innerHTML = photosSecHTML(); toast(U.saved); }catch(_){ toast(U.importFail); }
    return; }
  if(e.target.id!=='impfile' || !e.target.files[0]) return;
  const rd = new FileReader();
  rd.onload = () => { let j; try{ j = JSON.parse(rd.result); }catch(_){ j=null; }
    if(!j || j.app!=='yiki' || !j.data || !Array.isArray(j.data.sessions)){ toast(U.importFail); return; }
    ask(U.importConfirm).then(ok=>{ if(!ok) return; const prev = S; S = sanitize(j.data); if(save(true)) location.reload(); else { S = prev; toast(U.storageFull); } }); };
  rd.readAsText(e.target.files[0]); e.target.value='';
});

/* 換語言後，用藥時段跟著換成新語言的名稱（時段是固定 4 個：早／中／晚／睡前），今天的打勾紀錄也一起換 */
const ALL_SLOTS = [['早','中','晚','睡前'],['朝','昼','夜','寝る前'],['아침','점심','저녁','자기 전'],['Morning','Noon','Evening','Bedtime']];
function normalizeMedSlots(){
  let changed = false; const map = {};
  ALL_SLOTS.forEach(list => list.forEach((t,i) => { if(U.medSlots[i] && t !== U.medSlots[i]) map[t] = U.medSlots[i]; }));
  (S.meds||[]).forEach(m => { const nt = [...new Set(m.times.map(t => map[t] || t))]; if(nt.join('|') !== m.times.join('|')){ m.times = nt; changed = true; } });
  Object.values(S.medLog||{}).forEach(lg => Object.keys(lg).forEach(k => { const j = k.lastIndexOf('|'); const t = k.slice(j+1); if(map[t]){ const nk = k.slice(0,j+1) + map[t]; if(!(nk in lg)) lg[nk] = lg[k]; delete lg[k]; changed = true; } }));
  if(changed) save(true);
}
normalizeMedSlots();
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
